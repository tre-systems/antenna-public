<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08110f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Antenna" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Antenna</title>
    <script>
      // Pre-paint theme application so the first frame matches the persisted
      // user choice (or the system preference if they've never overridden).
      // Inline + synchronous = no FOUC.
      (function () {
        try {
          var saved = localStorage.getItem('antenna.theme');
          var mode = saved === 'light' || saved === 'dark' ? saved : null;
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var resolved = mode || system;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {
          /* localStorage unavailable — fall through to default light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
